name: CI

on:
  push:
    branches: [main, dev, next]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main, next]

jobs:
  lint:
    name: Lint & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Analyze example
        run: flutter analyze
        working-directory: example

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # flutter test runs cnativeapi's build hook, which compiles the core
      # against GTK 3, X11 and Xi on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config clang

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        shell: bash
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No package tests to run."
          fi

      - name: Run example tests
        shell: bash
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No example tests to run."
          fi
        working-directory: example

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            pkg-config \
            cmake \
            ninja-build \
            clang \
            libx11-dev \
            libxi-dev

      - name: Build example Linux
        run: flutter build linux --release
        working-directory: example

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Build example macOS
        run: flutter build macos --release
        working-directory: example

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Build example Windows
        run: flutter build windows --release
        working-directory: example

  # Publishes to pub.dev when a v<version> tag is pushed, once every other job
  # has passed. pub.dev's automated publishing must accept this repository
  # and the tag pattern v{{version}}.
  publish:
    name: Publish to pub.dev
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build-linux, build-macos, build-windows]
    permissions:
      id-token: write # Required for requesting the JWT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up the Dart SDK and provision the OIDC token used for publishing.
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      # Download Flutter SDK - needed for publishing Flutter packages.
      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d
        with:
          channel: stable
          version: 3.50.0

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish -f
